name: Deploy to VPS

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: vps
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run build

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - run: dotnet test server --configuration Release
            - run: dotnet publish server/Kamerbreed.API.csproj --configuration Release --output publish/api

            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

            - name: Upload site and API
              run: |
                  rsync -az --delete --chmod=D755,F644 dist/ deploy@${{ secrets.VPS_HOST }}:/var/www/kamerbreed/site/
                  rsync -az --delete --chmod=D755,F644 publish/api/ deploy@${{ secrets.VPS_HOST }}:/var/www/kamerbreed/api/

            - name: Restart API
              run: ssh deploy@${{ secrets.VPS_HOST }} sudo systemctl restart kamerbreed-api
